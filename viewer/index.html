<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GraphSurgeon 3D</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #000; }
    #app { width: 100%; height: 100%; position: relative; }
    canvas { display: block; }

    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      color: #0ff;
      font-family: 'Courier New', monospace;
      font-size: 13px;
      pointer-events: none;
      text-shadow: 0 0 8px #0ff;
      z-index: 10;
    }
    #hud h1 {
      font-size: 18px;
      margin-bottom: 4px;
      color: #fff;
      text-shadow: 0 0 12px #0ff;
    }

    #detail-panel {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 320px;
      max-height: calc(100vh - 32px);
      overflow-y: auto;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid #0ff;
      border-radius: 4px;
      color: #ddd;
      font-family: 'Courier New', monospace;
      font-size: 12px;
      padding: 12px;
      display: none;
      z-index: 10;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.2);
    }
    #detail-panel h2 {
      color: #0ff;
      font-size: 14px;
      margin-bottom: 8px;
      text-shadow: 0 0 6px #0ff;
    }
    #detail-panel .field {
      margin-bottom: 4px;
    }
    #detail-panel .label {
      color: #ccc;
    }
    #detail-panel .value {
      color: #fff;
    }
    #detail-panel .close-btn {
      position: absolute;
      top: 8px;
      right: 8px;
      color: #f0f;
      cursor: pointer;
      pointer-events: all;
      font-size: 16px;
      text-shadow: 0 0 6px #f0f;
    }

    #legend {
      position: absolute;
      bottom: 16px;
      left: 16px;
      color: #ddd;
      font-family: 'Courier New', monospace;
      font-size: 11px;
      z-index: 10;
      pointer-events: none;
    }
    #legend .entry {
      display: flex;
      align-items: center;
      margin-bottom: 3px;
    }
    #legend .swatch {
      width: 10px;
      height: 10px;
      border-radius: 2px;
      margin-right: 6px;
      display: inline-block;
    }

    #drop-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 255, 255, 0.1);
      border: 3px dashed #0ff;
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      color: #0ff;
      font-family: 'Courier New', monospace;
      font-size: 24px;
      text-shadow: 0 0 20px #0ff;
    }
  </style>
</head>
<body>
  <div id="app">
    <div id="hud">
      <h1>GRAPHSURGEON 3D</h1>
      <div id="hud-info"></div>
    </div>
    <div id="detail-panel">
      <span class="close-btn" id="close-detail">&times;</span>
      <div id="detail-content"></div>
    </div>
    <div id="legend"></div>
    <div id="drop-overlay">Drop scene.json here</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
