[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "graph-surgeon"
version = "0.1.0"
description = "ONNX computational DAG reverse-engineering toolkit: topology, motifs, counterfactual edits"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "GraphSurgeon Contributors"}]
keywords = ["onnx", "reverse-engineering", "graph", "neural-network", "dag"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24",
    "onnx>=1.14",
]

[project.optional-dependencies]
behavior = [
    "onnxruntime>=1.16",
    "torch>=2.0",
]
dev = [
    "pytest>=7.4",
    "onnxruntime>=1.16",
]

[project.scripts]
graph-surgeon = "graph_surgeon.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["graph_surgeon*"]

[tool.pytest.ini_options]
markers = [
    "integration: tests requiring external ONNX fixtures (GRAPH_SURGEON_FIXTURE_ROOT)",
]
testpaths = ["tests"]
